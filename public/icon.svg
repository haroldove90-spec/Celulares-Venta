<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Smartphone Body in Center Safe Zone -->
  <g filter="url(#shadow)">
    <!-- Phone frame -->
    <rect x="146" y="86" width="220" height="340" rx="36" fill="url(#phoneGrad)" />
    <!-- Screen -->
    <rect x="160" y="116" width="192" height="268" rx="20" fill="#0f172a" />
    
    <!-- Speaker ear piece / Dynamic island -->
    <rect x="226" y="98" width="60" height="8" rx="4" fill="#94a3b8" />
    <circle cx="210" cy="102" r="3" fill="#64748b" />
    
    <!-- Screen contents: POS Cash Register & Mobile Tech Graphic -->
    <!-- Screen top bar -->
    <rect x="176" y="132" width="70" height="10" rx="5" fill="#38bdf8" />
    <circle cx="330" cy="137" r="4" fill="#22c55e" />
    <circle cx="316" cy="137" r="4" fill="#38bdf8" />
    
    <!-- Barcode / POS shopping lines -->
    <rect x="176" y="156" width="160" height="36" rx="8" fill="#1e293b" />
    <text x="256" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">$ POS</text>
    
    <!-- Touch Grid representation on screen -->
    <rect x="176" y="204" width="45" height="42" rx="8" fill="#0284c7" />
    <rect x="233" y="204" width="45" height="42" rx="8" fill="#0284c7" />
    <rect x="291" y="204" width="45" height="42" rx="8" fill="#0284c7" />
    
    <rect x="176" y="256" width="45" height="42" rx="8" fill="#334155" />
    <rect x="233" y="256" width="45" height="42" rx="8" fill="#16a34a" />
    <rect x="291" y="256" width="45" height="42" rx="8" fill="#f59e0b" />
    
    <!-- Success checkout bar -->
    <rect x="176" y="310" width="160" height="28" rx="8" fill="url(#accentGrad)" />
    <path d="M236 324 L244 332 L260 316" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Home indicator -->
    <rect x="220" y="408" width="72" height="6" rx="3" fill="#cbd5e1" />
  </g>

  <!-- Sparkle badge on bottom right -->
  <circle cx="380" cy="380" r="44" fill="#10b981" filter="url(#shadow)" />
  <path d="M370 380 L377 387 L394 370" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
